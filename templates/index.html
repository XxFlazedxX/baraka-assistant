<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Baraka Al-Sanabel | Product Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Kufi+Arabic:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand-gold: #C68E17;
      --brand-dark: #2C2A27;
      --bg-color: #F9F8F6;
      --card-bg: #FFFFFF;
      --border-color: #E5E3DF;
      --text-muted: #7A7670;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background-color: var(--bg-color);
      color: var(--brand-dark);
      display: flex;
      justify-content: center;
      height: 100dvh;
      overflow: hidden;
    }

    .app {
      width: 100%;
      max-width: 800px;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      box-shadow: 0 0 40px rgba(0,0,0,0.05);
    }
    @media (min-width: 768px) {
      .app { height: 95dvh; margin-top: 2.5dvh; border-radius: 16px; border: 1px solid var(--border-color); }
    }

    .header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px;
      border-bottom: 1px solid var(--border-color);
      background: var(--card-bg);
      z-index: 10;
    }

    .avatar {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: var(--brand-gold);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Noto Kufi Arabic', sans-serif;
      font-size: 20px; font-weight: 600; color: #FFF;
      box-shadow: 0 4px 12px rgba(198, 142, 23, 0.2);
    }

    .header-info h1 {
      font-size: 1.15rem; font-weight: 600; color: var(--brand-dark); margin-bottom: 2px;
    }
    .header-status {
      font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 6px;
    }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #22C55E; }

    .messages { 
      flex: 1; 
      overflow-y: auto; 
      padding: 24px; 
      background: var(--bg-color);
      scroll-behavior: smooth;
    }
    .messages-inner { 
      max-width: 640px; 
      margin: 0 auto; 
      display: flex; 
      flex-direction: column; 
      gap: 20px; 
    }

    .msg-row { display: flex; gap: 12px; }
    .msg-row.user { justify-content: flex-end; }

    .bubble {
      padding: 14px 18px; border-radius: 12px; font-size: 14.5px; line-height: 1.6;
      max-width: 85%; white-space: pre-wrap; word-break: break-word;
    }
    .bubble.bot {
      background: #FFF; border: 1px solid var(--border-color); color: var(--brand-dark);
      border-bottom-left-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }
    .bubble.user {
      background: var(--brand-gold); color: #FFF; border-bottom-right-radius: 4px;
      box-shadow: 0 2px 8px rgba(198, 142, 23, 0.2);
    }
    .bubble strong { font-weight: 600; color: #1A1816; }
    .bubble a { color: var(--brand-gold); text-decoration: underline; }

    .bot-avatar {
      width: 32px; height: 32px; border-radius: 50%; background: var(--brand-gold);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Noto Kufi Arabic', sans-serif; color: #FFF; font-size: 14px; flex-shrink: 0;
      margin-top: 2px;
    }

    .suggestions {
      padding: 12px 24px; background: var(--card-bg); border-top: 1px solid var(--border-color);
      display: flex; gap: 8px; overflow-x: auto; white-space: nowrap;
    }
    .suggestions::-webkit-scrollbar { display: none; }
    .chip {
      padding: 8px 16px; border-radius: 999px; border: 1px solid var(--border-color);
      background: var(--bg-color); font-size: 13px; color: var(--brand-dark); cursor: pointer;
      transition: all 0.2s; font-family: 'Inter', sans-serif;
    }
    .chip:hover { background: var(--brand-gold); color: #FFF; border-color: var(--brand-gold); }

    .composer {
      padding: 16px 24px; background: var(--card-bg);
    }
    .composer-inner {
      display: flex; gap: 12px; align-items: center; max-width: 640px; margin: 0 auto;
    }
    .input-box {
      flex: 1; display: flex; align-items: center;
      border: 1px solid var(--border-color); border-radius: 12px;
      background: var(--bg-color); padding: 4px 8px; transition: border-color 0.2s;
    }
    .input-box:focus-within { border-color: var(--brand-gold); }
    .input-box input {
      flex: 1; border: none; background: transparent; padding: 12px; font-size: 15px;
      outline: none; color: var(--brand-dark); font-family: 'Inter', sans-serif;
    }
    .send-btn {
      width: 44px; height: 44px; border-radius: 10px; border: none;
      background: var(--brand-gold); color: #FFF; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.1s; flex-shrink: 0;
    }
    .send-btn:active { transform: scale(0.95); }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .send-btn svg { width: 18px; height: 18px; }

    .footer-info {
      display: flex; justify-content: center; gap: 16px; margin-top: 12px; font-size: 12px; color: var(--text-muted);
    }
    .footer-info a { color: inherit; text-decoration: none; transition: color 0.2s; }
    .footer-info a:hover { color: var(--brand-gold); }

    /* Typing Indicator */
    .typing { display: flex; align-items: center; gap: 4px; padding: 14px 18px; }
    .typing-dot { width: 6px; height: 6px; background: var(--brand-gold); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
  </style>
</head>
<body>

<div class="app">
  <header class="header">
    <div class="avatar">ب</div>
    <div class="header-info">
      <h1>Baraka Al-Sanabel</h1>
      <div class="header-status">
        <span class="status-dot"></span> Online · AI Product Assistant
      </div>
    </div>
  </header>

  <div class="messages" id="messages">
    <div class="messages-inner" id="messagesInner"></div>
  </div>

  <div class="suggestions" id="suggestions">
    <div class="suggestions-inner" id="suggestionsInner"></div>
  </div>

  <form class="composer" id="composerForm">
    <div class="composer-inner">
      <div class="input-box">
        <input type="text" id="messageInput" placeholder="Ask about our pasta…" autocomplete="off" aria-label="Message Baraka Assistant" />
      </div>
      <button type="submit" class="send-btn" id="sendBtn" aria-label="Send message" disabled>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="m22 2-7 20-4-9-9-4 20-7z"/></svg>
      </button>
    </div>
    <div class="footer-info">
      <span>Jeddah, Saudi Arabia</span>
      <span>•</span>
      <a href="mailto:info@basc-sa.com">info@basc-sa.com</a>
      <span>•</span>
      <a href="https://basc-sa.com" target="_blank">basc-sa.com</a>
    </div>
  </form>
</div>

<script>
  const SESSION_ID = `session_${Date.now()}_${Math.random().toString(36).slice(2, 11)}`;
  
  // These are the permanent suggestions
  const SUGGESTIONS = [
    "What pasta shapes do you make?",
    "Do you have whole wheat?",
    "Which countries do you export to?",
    "I want to place a bulk order",
  ];

  const messagesInner = document.getElementById('messagesInner');
  const suggestionsInner = document.getElementById('suggestionsInner');
  const input = document.getElementById('messageInput');
  const sendBtn = document.getElementById('sendBtn');
  const form = document.getElementById('composerForm');
  const messagesScroller = document.getElementById('messages');

  let sending = false;

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function renderMarkdown(text) {
    let html = escapeHtml(text);
    html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/(https?:\/\/\S+)/g, '<a href="$1" target="_blank" rel="noreferrer">$1</a>');
    html = html.replace(/\n/g, '<br>');
    return html;
  }

  function addMessage(role, text) {
    const isUser = role === 'user';
    const wrapper = document.createElement('div');
    wrapper.className = 'msg-row ' + role;

    if (isUser) {
      wrapper.innerHTML = `<div class="bubble user">${renderMarkdown(text)}</div>`;
    } else {
      wrapper.innerHTML = `
        <div class="bot-avatar">ب</div>
        <div class="bubble bot">${renderMarkdown(text)}</div>
      `;
    }

    messagesInner.appendChild(wrapper);
    scrollToBottom();
  }

  function showTyping() {
    const wrapper = document.createElement('div');
    wrapper.className = 'msg-row bot';
    wrapper.id = 'typingIndicator';
    wrapper.innerHTML = `
      <div class="bot-avatar">ب</div>
      <div class="bubble bot typing">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>
    `;
    messagesInner.appendChild(wrapper);
    scrollToBottom();
  }

  function hideTyping() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
  }

  function scrollToBottom() {
    requestAnimationFrame(() => {
      messagesScroller.scrollTo({ top: messagesScroller.scrollHeight, behavior: 'smooth' });
    });
  }

  function renderSuggestions() {
    suggestionsInner.innerHTML = '';
    SUGGESTIONS.forEach(s => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'chip';
      btn.innerText = s;
      btn.onclick = () => send(s);
      suggestionsInner.appendChild(btn);
    });
  }

  async function send(text) {
    const message = (text ?? input.value).trim();
    if (!message || sending) return;

    addMessage('user', message);
    input.value = '';
    sending = true;
    sendBtn.disabled = true;
    input.disabled = true;
    showTyping();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, session_id: SESSION_ID }),
      });
      const data = await res.json();
      hideTyping();
      addMessage('bot', data.response ?? '…');
    } catch (e) {
      hideTyping();
      addMessage('bot', "We couldn't reach the assistant. Please try again.");
    } finally {
      sending = false;
      sendBtn.disabled = false; // Keep send button active if they type again
      input.disabled = false;
      input.focus();
    }
  }

  form.addEventListener('submit', (e) => { e.preventDefault(); send(); });
  input.addEventListener('input', () => {
    sendBtn.disabled = !input.value.trim() || sending;
  });
  input.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); send(); }
  });

  // Initial welcome message for the UI
  addMessage('bot', "Welcome to **Baraka Al-Sanabel** 🌾\nمرحباً بك في بركة السنابل\n\nI'm the Baraka product assistant. Ask me about our pasta shapes, whole wheat line, Swiss manufacturing, certifications, export markets, or start a bulk order inquiry.");
  
  // Render the chips
  renderSuggestions();
  input.focus();
</script>

</body>
</html>
